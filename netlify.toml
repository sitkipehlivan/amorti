[build]
  command = "node build.js"
  publish = "dist"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# CANLI YAYIN
[context.production]
  # Kredi tasarrufu: yalnızca commit mesajında [deploy] varsa canlıya derle (bkz. CLAUDE.md, .github/workflows/toplu-yayin.yml)
  ignore = "git log -1 --format=%B | grep -qiE '\\[(deploy|yayinla)\\]' && exit 1 || exit 0"

# Görsel ve videolar Bunny CDN'den (scripts/cdn.mjs). Yalnızca canlı derlemede; önizlemeler etkilenmez.
[context.production.environment]
  CDN_URL = "https://amortisite.b-cdn.net"

# Uygulama: service worker her açılışta yeniden denetlensin; manifest doğru türle sunulsun
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=86400"
